<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Readiness Quiz - ajairu.ai</title>
    <meta name="description" content="A free, interactive AI readiness quiz for UK SMEs. Answer 24 questions and get a scored assessment of your AI readiness.">
    <style>
        :root {
            --bg: #0f1117;
            --card: #1a1d29;
            --text: #e4e4e7;
            --muted: #9ca3af;
            --accent: #6366f1;
            --accent-hover: #818cf8;
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
            --border: #2d3142;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; padding: 20px; }
        .container { max-width: 700px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 40px; }
        header h1 { font-size: 1.8rem; margin-bottom: 10px; }
        header p { color: var(--muted); font-size: 0.95rem; }
        .section { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 28px; margin-bottom: 24px; }
        .section h2 { font-size: 1.2rem; margin-bottom: 16px; color: var(--accent-hover); }
        .question { margin-bottom: 18px; }
        .question p { margin-bottom: 10px; font-size: 0.95rem; }
        .options { display: flex; gap: 8px; flex-wrap: wrap; }
        .option { padding: 8px 16px; border: 2px solid var(--border); border-radius: 8px; cursor: pointer; font-size: 0.85rem; transition: all 0.2s; background: transparent; color: var(--text); }
        .option:hover { border-color: var(--accent); }
        .option.selected { background: var(--accent); border-color: var(--accent); color: white; }
        .option.selected.yes { background: var(--success); border-color: var(--success); }
        .option.selected.partial { background: var(--warning); border-color: var(--warning); }
        .option.selected.no { background: var(--danger); border-color: var(--danger); }
        #results { display: none; }
        .score-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 32px; text-align: center; margin-bottom: 24px; }
        .score-card .big-score { font-size: 3rem; font-weight: bold; margin: 16px 0; }
        .score-card .label { color: var(--muted); font-size: 1rem; }
        .score-card .verdict { font-size: 1.2rem; margin: 12px 0; font-weight: 600; }
        .breakdown { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; }
        .breakdown-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; }
        .breakdown-item .bar { width: 100px; height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; }
        .breakdown-item .bar-fill { height: 100%; background: var(--accent); transition: width 0.5s; }
        .cta { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; text-align: center; }
        .cta a { color: var(--accent-hover); text-decoration: none; font-weight: 600; }
        .cta a:hover { text-decoration: underline; }
        .actions { display: flex; gap: 12px; justify-content: center; margin-top: 24px; }
        .btn { padding: 12px 28px; border-radius: 8px; border: none; cursor: pointer; font-size: 1rem; font-weight: 600; transition: all 0.2s; }
        .btn-primary { background: var(--accent); color: white; }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-secondary { background: transparent; color: var(--text); border: 2px solid var(--border); }
        .btn-secondary:hover { border-color: var(--accent); }
        footer { text-align: center; margin-top: 40px; color: var(--muted); font-size: 0.85rem; }
        footer a { color: var(--accent-hover); text-decoration: none; }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>AI Readiness Quiz</h1>
        <p>Answer 24 questions across 6 areas. Get an instant score showing how ready your UK SME is to adopt AI.</p>
    </header>

    <div id="quiz"></div>

    <div id="results">
        <div class="score-card">
            <p class="label">Your AI Readiness Score</p>
            <div class="big-score" id="bigScore">0/36</div>
            <div class="verdict" id="verdict"></div>
            <div class="breakdown" id="breakdown"></div>
        </div>
        <div class="cta" id="cta"></div>
        <div class="actions">
            <button class="btn btn-secondary" onclick="resetQuiz()">Retake Quiz</button>
        </div>
    </div>

    <footer>
        <p>Part of the <a href="https://github.com/t2thec/ajairu">ajairu</a> open-source resources for UK SMEs.</p>
        <p>For a full AI readiness assessment, visit <a href="https://ajairu.ai/assessment">ajairu.ai/assessment</a></p>
    </footer>
</div>

<script>
const sections = [
    { title: "Data Foundations", questions: [
        "Your business data is stored in structured, accessible systems",
        "You know where your critical data lives",
        "Data is reasonably clean and consistent",
        "You have documented what data you collect and who owns it",
        "You can query or export your data without a developer",
        "You have at least 6 months of historical data for the process you want to improve"
    ]},
    { title: "Clear Use Case", questions: [
        "You have identified a specific, measurable problem AI could help with",
        "You can describe the problem in one sentence",
        "You have a baseline metric for the current process",
        "You have defined what success looks like",
        "The problem is repetitive or involves pattern recognition",
        "You have ruled out simpler solutions"
    ]},
    { title: "Team and Skills", questions: [
        "Someone in your team is willing to own the AI initiative",
        "That person is comfortable with technology and willing to learn",
        "Your team is open to changing how they work",
        "You have access to external expertise for the gaps",
        "Leadership is supportive and budget is allocated",
        "You have time to dedicate (a few hours per week for a pilot)"
    ]},
    { title: "Technical Readiness", questions: [
        "Your systems can integrate with external APIs",
        "You have someone who can set up API or no-code integrations",
        "Your data is in a format AI can consume",
        "You have a test environment or can run a pilot safely",
        "You understand AI outputs need human review",
        "You have a way to measure whether the AI is working"
    ]},
    { title: "Governance and Risk", questions: [
        "You understand which of your data is personal data under UK GDPR",
        "You have a lawful basis for processing the data you would send to AI",
        "You know whether your AI provider processes data in the UK, EEA, or elsewhere",
        "You have considered bias and discrimination risks",
        "You have a plan for when AI gets something wrong",
        "You have or are willing to create a basic AI usage policy"
    ]},
    { title: "Budget and Expectations", questions: [
        "You understand AI is an ongoing cost, not a one-time purchase",
        "You have a rough idea of API costs for your use case",
        "You are prepared for the pilot to fail and willing to pivot",
        "You are not expecting AI to replace staff, but to augment them",
        "You have a timeline of weeks to months for initial results",
        "You are willing to invest in team training"
    ]}
];

const scores = {};
let quizHtml = '';

sections.forEach((section, sIdx) => {
    let qHtml = '';
    section.questions.forEach((q, qIdx) => {
        const id = `q-${sIdx}-${qIdx}`;
        scores[id] = 0;
        qHtml += `
        <div class="question">
            <p>${q}</p>
            <div class="options">
                <button class="option yes" onclick="selectAnswer('${id}', 2, this)">Yes</button>
                <button class="option partial" onclick="selectAnswer('${id}', 1, this)">Partial</button>
                <button class="option no" onclick="selectAnswer('${id}', 0, this)">No</button>
            </div>
        </div>`;
    });
    quizHtml += `<div class="section"><h2>${section.title}</h2>${qHtml}</div>`;
});

document.getElementById('quiz').innerHTML = quizHtml;

function selectAnswer(id, score, btn) {
    scores[id] = score;
    const parent = btn.parentElement;
    parent.querySelectorAll('.option').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
}

function calculateScore() {
    let total = 0;
    const sectionScores = [];
    sections.forEach((section, sIdx) => {
        let sectionTotal = 0;
        let sectionMax = section.questions.length * 2;
        section.questions.forEach((q, qIdx) => {
            const id = `q-${sIdx}-${qIdx}`;
            sectionTotal += scores[id];
        });
        total += sectionTotal;
        sectionScores.push({ title: section.title, score: sectionTotal, max: sectionMax });
    });
    return { total, sectionScores };
}

function showResults() {
    const { total, sectionScores } = calculateScore();
    const max = 36;

    document.getElementById('bigScore').textContent = `${total}/${max}`;

    let verdict, verdictColor, ctaHtml;
    if (total >= 30) {
        verdict = "Ready";
        verdictColor = "#22c55e";
        ctaHtml = `<p>You are well positioned to start an AI pilot.</p>
                   <p><a href="https://ajairu.ai">Contact ajairu.ai</a> for implementation support.</p>`;
    } else if (total >= 20) {
        verdict = "Nearly Ready";
        verdictColor = "#f59e0b";
        ctaHtml = `<p>Focus on your weakest area, usually data foundations or governance.</p>
                   <p><a href="https://ajairu.ai/assessment">Get a full assessment at ajairu.ai</a></p>`;
    } else if (total >= 10) {
        verdict = "Early Stage";
        verdictColor = "#f59e0b";
        ctaHtml = `<p>Invest in data, define a clear use case, and build team capability first.</p>
                   <p><a href="https://ajairu.ai/assessment">Start with an assessment at ajairu.ai</a></p>`;
    } else {
        verdict = "Not Ready Yet";
        verdictColor = "#ef4444";
        ctaHtml = `<p>Focus on getting your data and processes in order first. AI will be far more effective when foundations are solid.</p>
                   <p><a href="https://ajairu.ai">Talk to ajairu.ai about building your foundations</a></p>`;
    }

    const verdictEl = document.getElementById('verdict');
    verdictEl.textContent = verdict;
    verdictEl.style.color = verdictColor;

    let breakdownHtml = '';
    sectionScores.forEach(s => {
        const pct = (s.score / s.max) * 100;
        breakdownHtml += `
            <div class="breakdown-item">
                <span>${s.title}</span>
                <div class="bar"><div class="bar-fill" style="width: ${pct}%"></div></div>
                <span style="color: var(--muted); min-width: 50px; text-align: right;">${s.score}/${s.max}</span>
            </div>`;
    });
    document.getElementById('breakdown').innerHTML = breakdownHtml;
    document.getElementById('cta').innerHTML = ctaHtml;

    document.getElementById('quiz').style.display = 'none';
    document.getElementById('results').style.display = 'block';
    window.scrollTo(0, 0);
}

function resetQuiz() {
    Object.keys(scores).forEach(k => scores[k] = 0);
    document.querySelectorAll('.option').forEach(b => b.classList.remove('selected'));
    document.getElementById('results').style.display = 'none';
    document.getElementById('quiz').style.display = 'block';
    window.scrollTo(0, 0);
}

// Add submit button
const submitBtn = document.createElement('div');
submitBtn.innerHTML = '<div class="actions"><button class="btn btn-primary" onclick="showResults()">See My Score</button></div>';
document.getElementById('quiz').appendChild(submitBtn);
</script>
</body>
</html>
